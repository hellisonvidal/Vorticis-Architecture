# Gera o instalador do Windows e o APK do Android a cada envio para a main (ou manualmente, em Actions).
# Os arquivos ficam em Actions > execução > "Artifacts" por 90 dias.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  windows:
    name: Instalador para Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Compilar e empacotar
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.12.4 build
      - uses: actions/upload-artifact@v4
        with:
          name: Vorticis-Architecture-Windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    name: App para Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Chave de assinatura (opcional, segredos do repositório)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/vorticis.jks"; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/vorticis.jks" >> "$GITHUB_ENV"; fi
      - name: Compilar o APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android assembleRelease --no-daemon
          v=$(grep -o "APP_VERSION='[0-9.]*'" js/core.js | grep -o "[0-9.]*[0-9]")
          mkdir -p out && cp android/app/build/outputs/apk/release/app-release.apk "out/Vorticis-Architecture-v$v-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Vorticis-Architecture-Android
          path: out/*.apk
          if-no-files-found: error
