# Publica uma versão: ao publicar uma release no GitHub (ou enviar uma tag "v*", ex.: v1.0.0), anexa à release
#  - o app web compactado (para usar em qualquer servidor ou abrir localmente) e
#  - o instalador do programa para Windows (Tauri: .exe e .msi) e
#  - o app para Android (.apk).
name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da versão (ex.: v1.0.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

jobs:
  web:
    name: App web e release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empacotar o app web
        run: |
          mkdir -p pkg/vorticis-architecture
          cp -r index.html manifest.webmanifest sw.js icon.svg icons css js vendor README.md CHANGELOG.md pkg/vorticis-architecture/
          cd pkg && zip -qr "../Vorticis-Architecture-${TAG}-web.zip" vorticis-architecture
      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${TAG#v}" 'f&&/^## /{exit} index($0,"## ["v"]")==1{f=1;next} f' CHANGELOG.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Vorticis-Architecture-${TAG}-web.zip" --clobber
          else
            gh release create "$TAG" "Vorticis-Architecture-${TAG}-web.zip" --title "Vorticis Architecture ${TAG}" --notes-file notes.md
          fi

  windows:
    name: Programa para Windows
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Compilar e empacotar
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.12.4 build
      - name: Enviar instaladores para a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(desktop/src-tauri/target/release/bundle/nsis/*.exe desktop/src-tauri/target/release/bundle/msi/*.msi)
          [ ${#files[@]} -gt 0 ] || { echo "Nenhum instalador gerado"; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber

  android:
    name: App para Android
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Chave de assinatura (opcional, segredos do repositório)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/vorticis.jks"; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/vorticis.jks" >> "$GITHUB_ENV"; fi
      - name: Compilar e enviar o APK
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk "Vorticis-Architecture-${TAG}-android.apk"
          gh release upload "$TAG" "Vorticis-Architecture-${TAG}-android.apk" --clobber
