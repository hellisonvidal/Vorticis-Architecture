[package]
name = "vorticis-architecture"
version = "1.0.0"
description = "Vorticis Architecture — CAD arquitetônico"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
rfd = "0.17.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
