<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vorticis Architecture</title>
<meta name="description" content="CAD arquitetônico no navegador: paredes, portas, janelas, ambientes, cotas, terreno, fotos e vista 3D.">
<meta name="theme-color" content="#1b2026">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#15191e; --panel:#1f252c; --panel2:#262d35; --line:#333c47; --text:#e3e7ee; --muted:#8d97a5;
  --accent:#4da3ff; --accent2:#2f7fd6; --danger:#ff6b6b; --ok:#3fb950; --warn:#e3a33b;
  --radius:6px; --font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e9edf2; --panel:#f7f9fb; --panel2:#ffffff; --line:#d3dae3; --text:#1b2129; --muted:#5f6b7a;
    --accent:#0a66d1; --accent2:#0a55ad;
  }
}
:root[data-theme="dark"]{ --bg:#15191e; --panel:#1f252c; --panel2:#262d35; --line:#333c47; --text:#e3e7ee; --muted:#8d97a5; --accent:#4da3ff; --accent2:#2f7fd6; }
:root[data-theme="light"]{ --bg:#e9edf2; --panel:#f7f9fb; --panel2:#ffffff; --line:#d3dae3; --text:#1b2129; --muted:#5f6b7a; --accent:#0a66d1; --accent2:#0a55ad; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 var(--font);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:5px 9px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
button.danger{color:var(--danger)}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:4px 6px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:14px}
.brand svg{width:22px;height:22px}
#projName{width:170px}
.menu{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;min-width:0;flex:1}
.menu>button,.dd>summary{white-space:nowrap}
.dd{position:relative}
.dd>summary{list-style:none;cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:5px 9px}
.dd>summary::-webkit-details-marker{display:none}
.dd[open]>div{position:fixed;z-index:50;display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:4px;box-shadow:0 8px 24px #0006;margin-top:4px}
.dd>div button{text-align:left;border:0;background:transparent}
.dd>div button:hover{background:var(--panel2)}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
#main{display:grid;grid-template-columns:auto 1fr 290px;min-height:0}
#tools{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:4px;display:flex;flex-direction:column;gap:2px;width:96px}
#tools h4{margin:6px 2px 2px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
#tools .grp{display:grid;grid-template-columns:repeat(2,40px);gap:3px}
#tools button{width:40px;height:36px;padding:0;display:grid;place-items:center;background:transparent;border-color:transparent}
#tools button:hover{background:var(--panel2);border-color:var(--line)}
#tools button.on{background:var(--accent2);color:#fff}
#tools svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#stage{display:grid;grid-template-rows:auto 1fr auto;min-width:0;min-height:0}
#optbar{display:flex;align-items:center;gap:10px;padding:5px 10px;background:var(--panel);border-bottom:1px solid var(--line);min-height:36px;flex-wrap:wrap}
#optbar label{display:flex;align-items:center;gap:5px;color:var(--muted)}
#optbar input[type=number]{width:72px}
#optbar .hint{color:var(--muted)}
#canvasWrap{position:relative;min-height:0;overflow:hidden}
#cv,#cv3{position:absolute;inset:0;touch-action:none;display:block}
#cv{cursor:crosshair}
#cv.pan{cursor:grab}
#cv3{cursor:move}
#tip{position:absolute;pointer-events:none;background:#000b;color:#fff;padding:2px 6px;border-radius:4px;font-size:12px;white-space:nowrap;display:none}
.zoomBtns{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoomBtns button{width:34px;height:34px;padding:0;font-size:16px;background:var(--panel);opacity:.9}
#view3dBar{position:absolute;left:10px;top:10px;display:flex;gap:4px;flex-wrap:wrap}
#view3dBar button{background:var(--panel);opacity:.92}
#cmdArea{background:var(--panel);border-top:1px solid var(--line);padding:4px 10px}
#log{height:52px;overflow-y:auto;font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--muted);white-space:pre-wrap}
#log .err{color:var(--danger)} #log .res{color:var(--ok)}
.cmdrow{display:flex;gap:8px;align-items:center}
#promptTxt{font:12px ui-monospace,Consolas,monospace;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
#cmd{flex:1;font-family:ui-monospace,Consolas,monospace}
#panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-width:0}
#panel section{padding:8px 10px;border-bottom:1px solid var(--line)}
#panel h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.f{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:6px;margin-bottom:5px}
.f>span{color:var(--muted)}
.f input[type=checkbox]{justify-self:start}
.f .ro{padding:4px 0}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lay{display:grid;grid-template-columns:18px 26px 1fr 26px 26px 26px;gap:4px;align-items:center;margin-bottom:3px}
.lay input[type=color]{width:26px;height:24px;padding:1px}
.lay button{padding:2px 0;font-size:12px}
.lay.off .lname{opacity:.5}
.muted{color:var(--muted)}
footer{display:flex;align-items:center;gap:6px;padding:3px 10px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;overflow-x:auto;white-space:nowrap}
#coords{font-family:ui-monospace,Consolas,monospace;min-width:190px}
.tg{padding:2px 7px;font-size:11px;color:var(--muted)}
.tg.on{color:#fff;background:var(--accent2);border-color:var(--accent2)}
#saveInfo{margin-left:auto;color:var(--muted)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:0;max-width:min(760px,96vw);width:max-content;max-height:92vh}
dialog::backdrop{background:#0008}
dialog form{display:flex;flex-direction:column;max-height:92vh}
dialog h2{margin:0;padding:12px 16px;font-size:16px;border-bottom:1px solid var(--line)}
#dlgBody{padding:14px 16px;overflow:auto}
#dlgBtns{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.dtabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.dtabs button.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.grid2 label,.col label{display:flex;flex-direction:column;gap:3px;color:var(--muted)}
.terrWrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
.prev{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px}
.prev svg{width:100%;height:220px;display:block}
.prev .info{font-size:12px;color:var(--muted);padding:4px}
table.t{border-collapse:collapse;width:100%}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t input{width:90px}
.kbd{font-family:ui-monospace,Consolas,monospace;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.help-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px}
.mobile-only{display:none}
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;inset:0;padding:10mm;background:#fff;color:#000}
  #printArea img{max-width:100%;max-height:85vh;display:block;margin:0 auto}
  html,body{overflow:visible;background:#fff}
}
@media (max-width:900px){
  #main{grid-template-columns:auto 1fr}
  #panel{position:fixed;right:0;top:46px;bottom:28px;width:min(300px,90vw);z-index:40;display:none;box-shadow:-8px 0 24px #0006}
  #panel.open{display:block}
  .mobile-only{display:inline-block}
  #projName{width:110px}
  .brand span{display:none}
  .terrWrap{grid-template-columns:1fr}
}
@media (max-width:600px){
  #tools{width:52px}
  #tools .grp{grid-template-columns:40px}
  #tools h4{display:none}
  header{flex-wrap:wrap}
  .menu{order:3;flex-basis:100%}
  .grid2{grid-template-columns:1fr}
  #panel{top:84px}
  #optbar .hint{display:none}
  #optbar{min-height:0;padding:3px 8px}
  #log{height:36px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="6" fill="#2f7fd6"/><path d="M8 24V11l8-5 8 5v13" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M13 24v-6h6v6" fill="none" stroke="#fff" stroke-width="2.2"/></svg>
      <b>Vorticis</b><span>&nbsp;Architecture</span>
    </div>
    <input id="projName" title="Nome do projeto (renomeia ao alterar)" aria-label="Nome do projeto">
    <nav class="menu">
      <button data-act="new" title="Novo projeto">Novo</button>
      <button data-act="projects" title="Abrir projetos salvos">Projetos</button>
      <button data-act="save" title="Salvar (Ctrl+S)">Salvar</button>
      <details class="dd"><summary>Exportar ▾</summary><div>
        <button data-act="png">Imagem PNG</button>
        <button data-act="svg">Vetor SVG</button>
        <button data-act="dxf">DXF (AutoCAD)</button>
        <button data-act="json">Backup do projeto (JSON)</button>
        <button data-act="print">Imprimir / PDF</button>
      </div></details>
      <button data-act="import" title="Importar backup JSON">Importar</button>
      <button data-act="areas">Quadro de áreas</button>
      <button data-act="settings">Configurações</button>
      <button data-act="help">Ajuda</button>
    </nav>
    <div class="tabs">
      <button class="tab on" data-view="2d">Planta 2D</button>
      <button class="tab" data-view="3d">Vista 3D</button>
    </div>
    <button id="panelToggle" class="mobile-only" title="Propriedades e camadas">☰</button>
  </header>
  <div id="main">
    <aside id="tools" aria-label="Ferramentas"></aside>
    <section id="stage">
      <div id="optbar"></div>
      <div id="canvasWrap">
        <canvas id="cv"></canvas>
        <canvas id="cv3" hidden></canvas>
        <div id="tip"></div>
        <div id="view3dBar" hidden>
          <button data-v3="iso">Isométrica</button>
          <button data-v3="top">Superior</button>
          <button data-v3="front">Frontal</button>
          <button data-v3="fit">Enquadrar</button>
          <span class="muted" style="align-self:center;padding:0 6px">Arraste: girar · Shift/botão direito: mover · Roda: zoom</span>
        </div>
        <div class="zoomBtns">
          <button data-act="zoomin" title="Aproximar">+</button>
          <button data-act="zoomout" title="Afastar">−</button>
          <button data-act="extents" title="Enquadrar tudo (Z)">⤢</button>
        </div>
      </div>
      <div id="cmdArea">
        <div id="log"></div>
        <div class="cmdrow"><span id="promptTxt">Comando:</span><input id="cmd" autocomplete="off" spellcheck="false" placeholder="Digite um comando (ex.: PA, TE, L) ou valores (5 · 3;4 · @2;0 · @5&lt;45 · 10x20)" aria-label="Linha de comando"></div>
      </div>
    </section>
    <aside id="panel">
      <section><h3>Propriedades</h3><div id="props"></div></section>
      <section><h3>Camadas <button id="addLayer" title="Nova camada">+ Nova</button></h3><div id="layers"></div></section>
    </aside>
  </div>
  <footer>
    <span id="coords">X 0,00  Y 0,00</span>
    <button class="tg" data-tg="snap" title="Passo do cursor (F9)">PASSO</button>
    <button class="tg" data-tg="grid" title="Grade (F7)">GRADE</button>
    <button class="tg" data-tg="osnap" title="Snap a objetos (F3)">OSNAP</button>
    <button class="tg" data-tg="ortho" title="Modo ortogonal (F8)">ORTO</button>
    <span id="zoomInfo" class="muted"></span>
    <span id="saveInfo"></span>
  </footer>
</div>
<dialog id="dlg"><form method="dialog" onsubmit="return false"><h2 id="dlgTitle"></h2><div id="dlgBody"></div><div id="dlgBtns"></div></form></dialog>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<div id="printArea"></div>

<script>
'use strict';
/* =========================================================================
   Vorticis Architecture — CAD arquitetônico local-first (HTML único)
   ========================================================================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>{if(typeof v==='number')return v;const n=parseFloat(String(v).trim().replace(',','.'));return isFinite(n)?n:NaN;};
const fmt=(n,d=2)=>Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- geometria ---------- */
const P=(x,y)=>({x,y});
const add=(a,b)=>P(a.x+b.x,a.y+b.y), sub=(a,b)=>P(a.x-b.x,a.y-b.y), mul=(a,k)=>P(a.x*k,a.y*k);
const dot=(a,b)=>a.x*b.x+a.y*b.y, crs=(a,b)=>a.x*b.y-a.y*b.x;
const len=a=>Math.hypot(a.x,a.y), dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const norm=a=>{const l=len(a)||1;return P(a.x/l,a.y/l);};
const perp=a=>P(-a.y,a.x);
const mid=(a,b)=>P((a.x+b.x)/2,(a.y+b.y)/2);
const rotV=(v,ang)=>{const s=Math.sin(ang),c=Math.cos(ang);return P(v.x*c-v.y*s,v.x*s+v.y*c);};
const rotP=(p,c,ang)=>add(c,rotV(sub(p,c),ang));
const angOf=a=>Math.atan2(a.y,a.x);
const D2R=Math.PI/180, R2D=180/Math.PI;
const readable=a=>{while(a>Math.PI/2+1e-6)a-=Math.PI;while(a<=-Math.PI/2+1e-6)a+=Math.PI;return a;};
function segDist(p,a,b){const ab=sub(b,a),l2=dot(ab,ab);let t=l2?dot(sub(p,a),ab)/l2:0;t=Math.max(0,Math.min(1,t));return dist(p,add(a,mul(ab,t)));}
function projT(p,a,b){const ab=sub(b,a),l2=dot(ab,ab);return l2?dot(sub(p,a),ab)/l2:0;}
function segInt(a,b,c,d){const r=sub(b,a),s=sub(d,c),den=crs(r,s);if(Math.abs(den)<1e-12)return null;const t=crs(sub(c,a),s)/den,u=crs(sub(c,a),r)/den;if(t<-1e-9||t>1+1e-9||u<-1e-9||u>1+1e-9)return null;return add(a,mul(r,t));}
function lineInt(a,da,b,db){const den=crs(da,db);if(Math.abs(den)<1e-12)return null;const t=crs(sub(b,a),db)/den;return add(a,mul(da,t));}
function polyArea(pts){let s=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];s+=a.x*b.y-b.x*a.y;}return s/2;}
function polyPerim(pts,closed=true){let s=0;const n=pts.length;for(let i=0;i<n-(closed?0:1);i++)s+=dist(pts[i],pts[(i+1)%n]);return s;}
function centroid(pts){const A=polyArea(pts);if(Math.abs(A)<1e-9){let x=0,y=0;pts.forEach(p=>{x+=p.x;y+=p.y;});return P(x/pts.length,y/pts.length);}let cx=0,cy=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length],f=a.x*b.y-b.x*a.y;cx+=(a.x+b.x)*f;cy+=(a.y+b.y)*f;}return P(cx/(6*A),cy/(6*A));}
function pointInPoly(p,pts){let ins=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if(((a.y>p.y)!==(b.y>p.y))&&(p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x))ins=!ins;}return ins;}
function offsetPoly(pts,ds){const n=pts.length,s=Math.sign(polyArea(pts))||1,lines=[];for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n],d=norm(sub(b,a)),nn=mul(perp(d),s);lines.push({p:add(a,mul(nn,ds[i]||0)),d});}const out=[];for(let i=0;i<n;i++){const L0=lines[(i-1+n)%n],L1=lines[i];out.push(lineInt(L0.p,L0.d,L1.p,L1.d)||L1.p);}return out;}
const rectPts=(a,b)=>[P(a.x,a.y),P(b.x,a.y),P(b.x,b.y),P(a.x,b.y)];
const cp=p=>P(p.x,p.y);

/* ---------- documento ---------- */
const DEFAULT_LAYERS=[
  {id:'geral',name:'Geral',color:'auto'},
  {id:'paredes',name:'Paredes',color:'auto'},
  {id:'esquadrias',name:'Esquadrias',color:'#e3a33b'},
  {id:'ambientes',name:'Ambientes',color:'#c792ea'},
  {id:'mobiliario',name:'Mobiliário',color:'#6fb3d9'},
  {id:'cotas',name:'Cotas',color:'#4fa3ff'},
  {id:'textos',name:'Textos',color:'auto'},
  {id:'terreno',name:'Terreno',color:'#3fb950'},
  {id:'imagens',name:'Imagens',color:'auto'},
];
const DEFAULT_SETTINGS={gridStep:1,snapStep:0.05,wallT:0.15,wallH:2.8,doorW:0.8,doorH:2.1,winW:1.2,winSill:1.0,winH:1.2,textSize:0.25,dimSize:0.2,blockKind:'cama_casal',autoLayer:true,theme:'dark',mirrorErase:false};
const TYPE_LAYER={wall:'paredes',door:'esquadrias',window:'esquadrias',room:'ambientes',block:'mobiliario',dim:'cotas',text:'textos',terrain:'terreno',image:'imagens'};
const ORDER={image:0,terrain:1,room:2,polyline:3,line:3,circle:3,block:3,wall:5,door:6,window:6,dim:7,text:8};
const TYPE_NAME={line:'Linha',polyline:'Polilinha',circle:'Círculo',wall:'Parede',door:'Porta',window:'Janela',room:'Ambiente',terrain:'Terreno',dim:'Cota',text:'Texto',image:'Imagem',block:'Mobiliário'};
function newDoc(name){return{app:'vorticis-architecture',version:1,name:name||'Projeto 1',layers:clone(DEFAULT_LAYERS).map(l=>({...l,visible:true,locked:false})),activeLayer:'geral',objects:[],images:{},settings:{...DEFAULT_SETTINGS},view:null};}
let doc=newDoc();
const getLayer=id=>doc.layers.find(l=>l.id===id)||doc.layers[0];
const getObj=id=>doc.objects.find(o=>o.id===id);
function layerFor(type){if(doc.settings.autoLayer){const id=TYPE_LAYER[type];if(id&&doc.layers.some(l=>l.id===id))return id;}return doc.activeLayer;}
function addObj(o){const n=clone(o);n.id=uid();if(!n.layer)n.layer=layerFor(n.type);doc.objects.push(n);return n;}
const S=()=>doc.settings;

/* ---------- estado da aplicação ---------- */
const prefs=Object.assign({snap:true,grid:true,osnap:true,ortho:false},(()=>{try{return JSON.parse(localStorage.getItem('va:prefs')||'{}');}catch(e){return{};}})());
function savePrefs(){try{localStorage.setItem('va:prefs',JSON.stringify(prefs));}catch(e){}}
let view={cx:10,cy:8,s:30};
let sel=new Set(), hoverId=null, tool=null, lastCmd=null, pendingCmd=null, panMode=false, mode3d=false;
let mouseS=P(0,0), mouseW=P(0,0), snapRes={p:P(0,0),k:null}, mouseIn=false;
let drag=null; // {type:'pan'|'grip'|'move'|'window'|'pinch', ...}
let clipboard=null, measureOverlay=null;
const imgCache={};

/* ---------- blocos de mobiliário ---------- */
function rectL(x0,y0,x1,y1){return[P(x0,y0),P(x1,y0),P(x1,y1),P(x0,y1)];}
function ellL(cx,cy,rx,ry,n=28){const a=[];for(let i=0;i<n;i++){const t=i/n*2*Math.PI;a.push(P(cx+rx*Math.cos(t),cy+ry*Math.sin(t)));}return a;}
const pl=(pts,closed=true,ex={})=>({k:'poly',pts,closed,stroke:'L',lw:1,...ex});
const ci=(c,r,ex={})=>({k:'circle',c,r,stroke:'L',lw:1,...ex});
function chair(cx,cy,rot){const b=[rectL(-.2,-.2,.2,.2),[P(-.2,.14),P(.2,.14)]];return [pl(b[0].map(p=>add(P(cx,cy),rotV(p,rot)))),pl(b[1].map(p=>add(P(cx,cy),rotV(p,rot))),false)];}
const BLOCKS={
  cama_casal:{name:'Cama casal',w:1.38,d:1.88,h:.5,draw:(w,d)=>{const x=w/2,y=d/2;return[pl(rectL(-x,-y,x,y)),pl(rectL(-x+.06,y-.36,-.04,y-.08)),pl(rectL(.04,y-.36,x-.06,y-.08)),pl([P(-x,y-.48),P(x,y-.48)],false),pl([P(-x,y-.48),P(x,-y*.15)],false,{lw:.6})];}},
  cama_solteiro:{name:'Cama solteiro',w:.88,d:1.88,h:.5,draw:(w,d)=>{const x=w/2,y=d/2;return[pl(rectL(-x,-y,x,y)),pl(rectL(-x+.08,y-.36,x-.08,y-.08)),pl([P(-x,y-.48),P(x,y-.48)],false),pl([P(-x,y-.48),P(x,-y*.15)],false,{lw:.6})];}},
  sofa:{name:'Sofá',w:2.0,d:.85,h:.8,draw:(w,d)=>{const x=w/2,y=d/2;return[pl(rectL(-x,-y,x,y)),pl(rectL(-x,y-.2,x,y)),pl(rectL(-x,-y,-x+.18,y-.2)),pl(rectL(x-.18,-y,x,y-.2)),pl([P(0,-y),P(0,y-.2)],false,{lw:.6})];}},
  poltrona:{name:'Poltrona',w:.8,d:.8,h:.8,draw:(w,d)=>{const x=w/2,y=d/2;return[pl(rectL(-x,-y,x,y)),pl(rectL(-x,y-.18,x,y)),pl(rectL(-x,-y,-x+.14,y-.18)),pl(rectL(x-.14,-y,x,y-.18))];}},
  mesa4:{name:'Mesa 4 lugares',w:1.2,d:.8,h:.75,draw:(w,d)=>{const x=w/2,y=d/2;return[pl(rectL(-x,-y,x,y)),...chair(-w/4,y+.22,0),...chair(w/4,y+.22,0),...chair(-w/4,-y-.22,Math.PI),...chair(w/4,-y-.22,Math.PI)];}},
  mesa_redonda:{name:'Mesa redonda',w:1.0,d:1.0,h:.75,draw:(w)=>{const r=w/2;return[ci(P(0,0),r),...chair(0,r+.22,0),...chair(0,-r-.22,Math.PI),...chair(r+.22,0,-Math.PI/2),...chair(-r-.22,0,Math.PI/2)];}},
  vaso:{name:'Vaso sanitário',w:.38,d:.65,h:.4,draw:(w,d)=>{const x=w/2,y=d/2;return[pl(rectL(-x,y-.18,x,y)),pl(ellL(0,-.07,x*.9,(d-.18)/2*.95))];}},
  lavatorio:{name:'Lavatório',w:.5,d:.42,h:.85,draw:(w,d)=>{const x=w/2,y=d/2;return[pl(rectL(-x,-y,x,y)),pl(ellL(0,-.03,x*.7,y*.6)),ci(P(0,y-.06),.025)];}},
  chuveiro:{name:'Box / chuveiro',w:.9,d:.9,h:.05,draw:(w,d)=>{const x=w/2,y=d/2;return[pl(rectL(-x,-y,x,y)),pl([P(-x,-y),P(x,y)],false,{lw:.5,dash:[4,3]}),pl([P(-x,y),P(x,-y)],false,{lw:.5,dash:[4,3]}),ci(P(0,0),.04)];}},
  pia:{name:'Pia de cozinha',w:1.2,d:.6,h:.9,draw:(w,d)=>{const x=w/2,y=d/2;return[pl(rectL(-x,-y,x,y)),pl(rectL(-x+.1,-y+.08,-x+.6,y-.1)),ci(P(-x+.35,0),.03),ci(P(-x+.35,y-.05),.025)];}},
  fogao:{name:'Fogão',w:.55,d:.6,h:.9,draw:(w,d)=>{const x=w/2,y=d/2;return[pl(rectL(-x,-y,x,y)),ci(P(-.13,-.1),.08),ci(P(.13,-.1),.08),ci(P(-.13,.15),.08),ci(P(.13,.15),.08)];}},
  geladeira:{name:'Geladeira',w:.7,d:.7,h:1.8,draw:(w,d)=>{const x=w/2,y=d/2;return[pl(rectL(-x,-y,x,y)),pl(rectL(-x+.05,-y+.05,x-.05,y-.05),true,{lw:.5}),pl([P(-x,-y),P(x,y)],false,{lw:.5})];}},
  guarda_roupa:{name:'Guarda-roupa',w:1.6,d:.6,h:2.1,draw:(w,d)=>{const x=w/2,y=d/2;return[pl(rectL(-x,-y,x,y)),pl([P(-x,0),P(x,0)],false,{lw:.5,dash:[5,3]}),pl([P(0,-y),P(0,y)],false,{lw:.6})];}},
  carro:{name:'Carro',w:1.8,d:4.3,h:1.5,draw:(w,d)=>{const x=w/2,y=d/2;const body=[P(-x+.15,-y),P(x-.15,-y),P(x,-y+.3),P(x,y-.4),P(x-.2,y),P(-x+.2,y),P(-x,y-.4),P(-x,-y+.3)];return[pl(body),pl([P(-x+.15,y-1.2),P(x-.15,y-1.2),P(x-.25,y-.65),P(-x+.25,y-.65)]),pl([P(-x+.18,-y+.9),P(x-.18,-y+.9),P(x-.25,-y+.45),P(-x+.25,-y+.45)])];}},
  arvore:{name:'Árvore',w:3,d:3,h:4,draw:(w)=>{const r=w/2,a=[ci(P(0,0),r,{lw:.8}),ci(P(0,0),r*.12)];for(let i=0;i<8;i++){const t=i*Math.PI/4;a.push(pl([P(Math.cos(t)*r*.12,Math.sin(t)*r*.12),P(Math.cos(t)*r*.8,Math.sin(t)*r*.8)],false,{lw:.5}));}return a;}},
};

/* ---------- paredes e aberturas ---------- */
function wallInfo(w){const d=sub(w.b,w.a),L=len(d),u=L?mul(d,1/L):P(1,0);return{L,u,n:perp(u)};}
function wallExt(w){let ea=0,eb=0;for(const o of doc.objects){if(o.type!=='wall'||o.id===w.id)continue;for(const q of[o.a,o.b]){if(dist(q,w.a)<1e-4)ea=Math.max(ea,o.t/2);if(dist(q,w.b)<1e-4)eb=Math.max(eb,o.t/2);}}return[Math.min(ea,w.t/2*4),Math.min(eb,w.t/2*4)];}
function wallPoly(w){const{u,n}=wallInfo(w),[ea,eb]=wallExt(w),h=w.t/2,a=sub(w.a,mul(u,ea)),b=add(w.b,mul(u,eb));return[add(a,mul(n,h)),add(b,mul(n,h)),sub(b,mul(n,h)),sub(a,mul(n,h))];}
function openingsOf(wallIds){const s=new Set(wallIds);return doc.objects.filter(o=>(o.type==='door'||o.type==='window')&&s.has(o.wallId));}
function openingGeom(o){const w=getObj(o.wallId);if(!w)return null;const{L,u,n}=wallInfo(w);const off=Math.max(o.w/2,Math.min(L-o.w/2,o.off));const c=add(w.a,mul(u,off));return{w,L,u,n,c,off,t:w.t};}

/* ---------- primitivas (base de desenho, seleção, SVG e DXF) ---------- */
function prims(o){
  const ts=S().textSize;
  switch(o.type){
    case 'line':return[{k:'poly',pts:[o.a,o.b],closed:false,stroke:'L',lw:1.2}];
    case 'polyline':return[{k:'poly',pts:o.pts,closed:!!o.closed,stroke:'L',lw:1.2}];
    case 'circle':return[{k:'circle',c:o.c,r:o.r,stroke:'L',lw:1.2}];
    case 'wall':return[{k:'poly',pts:wallPoly(o),closed:true,stroke:'L',fill:'WF',lw:1.2,hitFill:true}];
    case 'door':case 'window':{
      const g=openingGeom(o);if(!g)return[];
      const{u,n,c,t}=g,h=o.w/2,p1=add(c,mul(u,-h)),p2=add(c,mul(u,h)),T=t/2;
      const a=[{k:'poly',pts:[add(p1,mul(n,T+.004)),add(p2,mul(n,T+.004)),sub(p2,mul(n,T+.004)),sub(p1,mul(n,T+.004))],closed:true,fill:'BG',hitFill:true},
        {k:'poly',pts:[add(p1,mul(n,T)),sub(p1,mul(n,T))],closed:false,stroke:'F',lw:1.2},
        {k:'poly',pts:[add(p2,mul(n,T)),sub(p2,mul(n,T))],closed:false,stroke:'F',lw:1.2}];
      if(o.type==='door'){
        const sd=o.flip?-1:1,nn=mul(n,sd),hinge=o.hinge?p2:p1,other=o.hinge?p1:p2;
        const hf=add(hinge,mul(nn,T)),of=add(other,mul(nn,T)),le=add(hf,mul(nn,o.w));
        const a0=angOf(sub(le,hf)),a1=angOf(sub(of,hf));let da=a1-a0;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
        a.push({k:'poly',pts:[hf,le],closed:false,stroke:'L',lw:2});
        a.push({k:'arc',c:hf,r:o.w,a0,a1,ccw:da>0,stroke:'L',lw:.8,dash:[4,3]});
      }else{
        a.push({k:'poly',pts:[add(p1,mul(n,T)),add(p2,mul(n,T))],closed:false,stroke:'L',lw:1});
        a.push({k:'poly',pts:[sub(p1,mul(n,T)),sub(p2,mul(n,T))],closed:false,stroke:'L',lw:1});
        a.push({k:'poly',pts:[add(p1,mul(n,T/4)),add(p2,mul(n,T/4))],closed:false,stroke:'L',lw:.8});
        a.push({k:'poly',pts:[sub(p1,mul(n,T/4)),sub(p2,mul(n,T/4))],closed:false,stroke:'L',lw:.8});
      }
      return a;
    }
    case 'room':{
      if(o.pts.length<3)return[];
      const A=Math.abs(polyArea(o.pts)),c=centroid(o.pts),sz=o.size||Math.max(ts,Math.min(.8,Math.sqrt(A)/18));
      return[{k:'poly',pts:o.pts,closed:true,stroke:'L',fill:'L',fillAlpha:.10,lw:.8,dash:[5,3]},
        {k:'text',p:add(c,P(0,sz*.65)),text:o.name||'Ambiente',size:sz,ang:0,color:'L',align:'center',base:'middle',bold:true},
        {k:'text',p:sub(c,P(0,sz*.65)),text:fmt(A)+' m²',size:sz*.85,ang:0,color:'L',align:'center',base:'middle'}];
    }
    case 'terrain':{
      const pts=o.pts;if(pts.length<3)return[];
      const sz=o.size||Math.max(ts,Math.min(3,Math.sqrt(Math.abs(polyArea(pts)))/30)),sg=Math.sign(polyArea(pts))||1,n=pts.length,a=[];
      a.push({k:'poly',pts,closed:true,stroke:'L',fill:'L',fillAlpha:.05,lw:2,dash:[14,4,2,4]});
      for(let i=0;i<n;i++){
        const p=pts[i],q=pts[(i+1)%n],d=norm(sub(q,p)),out=mul(perp(d),-sg),L=dist(p,q);
        if(L<1e-6)continue;
        a.push({k:'text',p:add(mid(p,q),mul(out,sz*.75)),text:fmt(L)+' m',size:sz*.8,ang:readable(angOf(d)),color:'L',align:'center',base:'middle'});
        const pr=pts[(i-1+n)%n],d0=norm(sub(p,pr)),inw=add(mul(perp(d0),sg),mul(perp(d),sg)),bis=len(inw)>1e-6?mul(norm(inw),-1):out;
        a.push({k:'circle',c:p,r:sz*.18,stroke:'L',fill:'L',lw:1});
        a.push({k:'text',p:add(p,mul(bis,sz*.9)),text:'V'+(i+1),size:sz*.6,ang:0,color:'L',align:'center',base:'middle'});
      }
      const A=Math.abs(polyArea(pts));let lab=(o.name||'Terreno')+'\nÁrea: '+fmt(A)+' m²\nPerímetro: '+fmt(polyPerim(pts))+' m';
      if(o.setbacks&&o.setbacks.some(v=>v>0)){
        const sp=offsetPoly(pts,o.setbacks);
        a.push({k:'poly',pts:sp,closed:true,stroke:'L',lw:.8,dash:[3,3]});
        lab+='\nÁrea edificável: '+fmt(Math.abs(polyArea(sp)))+' m²';
      }
      // rótulo fora do terreno, junto ao 1º lado (frente), para não cobrir a edificação
      {const p0=pts[0],p1=pts[1],d=norm(sub(p1,p0)),out=mul(perp(d),-sg),nl=lab.split('\n').length;
       a.push({k:'text',p:add(mid(p0,p1),mul(out,sz*(1.9+nl*.6))),text:lab,size:sz,ang:readable(angOf(d)),color:'L',align:'center',base:'middle'});}
      return a;
    }
    case 'dim':{
      const d=sub(o.b,o.a),L=len(d);if(L<1e-9)return[];
      const u=mul(d,1/L),n=perp(u),sz=o.size||S().dimSize,sg=Math.sign(o.off)||1,a2=add(o.a,mul(n,o.off)),b2=add(o.b,mul(n,o.off));
      const ext=sz*.4,gap=Math.min(Math.abs(o.off),sz*.3),tk=mul(norm(add(u,n)),sz*.35);
      const ang=readable(angOf(u)),tn=perp(P(Math.cos(ang),Math.sin(ang)));
      return[
        {k:'poly',pts:[add(o.a,mul(n,sg*gap)),add(a2,mul(n,sg*ext))],closed:false,stroke:'L',lw:.7},
        {k:'poly',pts:[add(o.b,mul(n,sg*gap)),add(b2,mul(n,sg*ext))],closed:false,stroke:'L',lw:.7},
        {k:'poly',pts:[sub(a2,mul(u,ext)),add(b2,mul(u,ext))],closed:false,stroke:'L',lw:.8},
        {k:'poly',pts:[sub(a2,tk),add(a2,tk)],closed:false,stroke:'L',lw:1.6},
        {k:'poly',pts:[sub(b2,tk),add(b2,tk)],closed:false,stroke:'L',lw:1.6},
        {k:'text',p:add(mid(a2,b2),mul(tn,sz*.25)),text:o.text||fmt(L),size:sz,ang,color:'L',align:'center',base:'bottom'}];
    }
    case 'text':return[{k:'text',p:o.p,text:o.text,size:o.size||ts,ang:o.ang||0,color:'L',align:'left',base:'bottom'}];
    case 'image':return[{k:'image',p:o.p,w:o.w,h:o.h,rot:o.rot||0,flip:!!o.flip,img:o.img,opacity:o.opacity??1}];
    case 'block':{
      const B=BLOCKS[o.kind]||BLOCKS.cama_casal,loc=B.draw(o.w||B.w,o.d||B.d),rot=o.rot||0;
      const T=q=>add(o.p,rotV(o.mirror?P(-q.x,q.y):q,rot));
      return loc.map(pr=>pr.k==='poly'?{...pr,pts:pr.pts.map(T)}:{...pr,c:T(pr.c)});
    }
  }
  return[];
}
function textBox(pr){
  const lines=String(pr.text).split('\n'),n=lines.length,w=Math.max(...lines.map(l=>l.length))*pr.size*.58,h=n*pr.size*1.2;
  let x0=pr.align==='center'?-w/2:0,y0=pr.base==='middle'?-h/2:-pr.size*.25;
  const c=[P(x0,y0),P(x0+w,y0),P(x0+w,y0+h),P(x0,y0+h)];
  return c.map(q=>add(pr.p,rotV(q,pr.ang||0)));
}
function imageCorners(pr){const f=pr.flip?-1:1;return[P(0,0),P(f*pr.w,0),P(f*pr.w,pr.h),P(0,pr.h)].map(q=>add(pr.p,rotV(q,pr.rot||0)));}
function primPts(pr){
  if(pr.k==='poly')return pr.pts;
  if(pr.k==='circle'||pr.k==='arc')return[P(pr.c.x-pr.r,pr.c.y-pr.r),P(pr.c.x+pr.r,pr.c.y+pr.r)];
  if(pr.k==='text')return textBox(pr);
  if(pr.k==='image')return imageCorners(pr);
  return[];
}
function primDist(pr,p){
  if(pr.k==='poly'){
    if(pr.hitFill&&pr.closed&&pointInPoly(p,pr.pts))return 0;
    let d=Infinity;const n=pr.pts.length;for(let i=0;i<n-(pr.closed?0:1);i++)d=Math.min(d,segDist(p,pr.pts[i],pr.pts[(i+1)%n]));return d;
  }
  if(pr.k==='circle'){const d=dist(p,pr.c);if(pr.hitFill&&d<pr.r)return 0;return Math.abs(d-pr.r);}
  if(pr.k==='arc')return Math.abs(dist(p,pr.c)-pr.r);
  if(pr.k==='text'){const b=textBox(pr);if(pointInPoly(p,b))return 0;let d=Infinity;for(let i=0;i<4;i++)d=Math.min(d,segDist(p,b[i],b[(i+1)%4]));return d;}
  if(pr.k==='image'){const b=imageCorners(pr);return pointInPoly(p,b)?0:Infinity;}
  return Infinity;
}
function hitObj(o,p){let d=Infinity;for(const pr of prims(o))d=Math.min(d,primDist(pr,p));return d;}
function objBBox(o){let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;for(const pr of prims(o))for(const q of primPts(pr)){x0=Math.min(x0,q.x);y0=Math.min(y0,q.y);x1=Math.max(x1,q.x);y1=Math.max(y1,q.y);}return x0<=x1?{x0,y0,x1,y1}:null;}
function docBBox(list){let b=null;for(const o of list||doc.objects){if(getLayer(o.layer).visible===false)continue;const q=objBBox(o);if(!q)continue;b=b?{x0:Math.min(b.x0,q.x0),y0:Math.min(b.y0,q.y0),x1:Math.max(b.x1,q.x1),y1:Math.max(b.y1,q.y1)}:q;}return b;}
function pickAt(p){
  const tol=7/view.s;let best=null,bd=Infinity,bo=-1;
  for(const o of doc.objects){const L=getLayer(o.layer);if(L.visible===false||L.locked)continue;let d=hitObj(o,p);if(d>tol)continue;if(ORDER[o.type]<3)d+=tol*.5;
    if(d<bd-1e-9||(Math.abs(d-bd)<1e-9&&ORDER[o.type]>bo)){bd=d;best=o;bo=ORDER[o.type];}}
  return best;
}

/* ---------- snaps ---------- */
function snapPts(o){
  const r=[],E=(p,k)=>r.push({p,k});
  switch(o.type){
    case 'line':E(o.a,'end');E(o.b,'end');E(mid(o.a,o.b),'mid');break;
    case 'wall':E(o.a,'end');E(o.b,'end');E(mid(o.a,o.b),'mid');wallPoly(o).forEach(p=>E(p,'end'));break;
    case 'polyline':case 'room':case 'terrain':{const n=o.pts.length,cl=o.type!=='polyline'||o.closed;o.pts.forEach(p=>E(p,'end'));for(let i=0;i<n-(cl?0:1);i++)E(mid(o.pts[i],o.pts[(i+1)%n]),'mid');break;}
    case 'circle':E(o.c,'cen');[0,1,2,3].forEach(i=>E(add(o.c,P(Math.cos(i*Math.PI/2)*o.r,Math.sin(i*Math.PI/2)*o.r)),'end'));break;
    case 'text':case 'block':E(o.p,'end');break;
    case 'image':imageCorners(prims(o)[0]).forEach(p=>E(p,'end'));break;
    case 'door':case 'window':{const g=openingGeom(o);if(g){E(g.c,'mid');E(add(g.c,mul(g.u,o.w/2)),'end');E(sub(g.c,mul(g.u,o.w/2)),'end');}break;}
  }
  return r;
}
function segsOf(o){
  switch(o.type){
    case 'line':case 'wall':return[[o.a,o.b]];
    case 'polyline':case 'room':case 'terrain':{const s=[],n=o.pts.length,cl=o.type!=='polyline'||o.closed;for(let i=0;i<n-(cl?0:1);i++)s.push([o.pts[i],o.pts[(i+1)%n]]);return s;}
  }
  return[];
}
const SNAP_PRI={end:0,int:0,mid:1,cen:1};
function findOsnap(p,exclude){
  const tol=12/view.s;let best=null,bd=Infinity;const near=[];
  for(const o of doc.objects){
    if(exclude&&exclude.has(o.id))continue;if(getLayer(o.layer).visible===false)continue;
    for(const s of snapPts(o)){const d=dist(s.p,p)+SNAP_PRI[s.k]*tol*.15;if(d<tol&&d<bd){bd=d;best=s;}}
    for(const sg of segsOf(o))if(segDist(p,sg[0],sg[1])<tol)near.push(sg);
  }
  if(near.length<40)for(let i=0;i<near.length;i++)for(let j=i+1;j<near.length;j++){const q=segInt(near[i][0],near[i][1],near[j][0],near[j][1]);if(q){const d=dist(q,p);if(d<tol&&d<bd){bd=d;best={p:q,k:'int'};}}}
  return best?{p:cp(best.p),k:best.k}:null;
}
function updateSnap(){
  let p=mouseW,k=null;const base=tool&&tool.base;
  const active=tool||(drag&&(drag.type==='grip'||drag.type==='move'));
  if(active&&prefs.osnap){const r=findOsnap(mouseW,drag&&drag.exclude);if(r){p=r.p;k=r.k;}}
  if(!k&&active){
    const st=S().snapStep;
    if(prefs.ortho&&base){const d=sub(p,base);if(Math.abs(d.x)>=Math.abs(d.y)){p=P(p.x,base.y);if(prefs.snap)p.x=base.x+Math.round((p.x-base.x)/st)*st;}else{p=P(base.x,p.y);if(prefs.snap)p.y=base.y+Math.round((p.y-base.y)/st)*st;}}
    else if(prefs.snap)p=P(Math.round(p.x/st)*st,Math.round(p.y/st)*st);
  }
  snapRes={p,k};
}
const cur=()=>snapRes.p;

/* ---------- desfazer/refazer ---------- */
let undoStack=[],redoStack=[],lastState=null;
const snapshot=()=>JSON.stringify({layers:doc.layers,objects:doc.objects,activeLayer:doc.activeLayer});
function resetHistory(){undoStack=[];redoStack=[];lastState=snapshot();}
function commit(){const s=snapshot();if(s===lastState)return;undoStack.push(lastState);if(undoStack.length>200)undoStack.shift();redoStack=[];lastState=s;changed();}
function restoreState(s){const o=JSON.parse(s);doc.layers=o.layers;doc.objects=o.objects;doc.activeLayer=o.activeLayer;for(const id of[...sel])if(!getObj(id))sel.delete(id);lastState=s;changed();}
function undo(){if(!undoStack.length)return log('Nada para desfazer.');redoStack.push(snapshot());restoreState(undoStack.pop());log('Desfeito.');}
function redo(){if(!redoStack.length)return log('Nada para refazer.');undoStack.push(snapshot());restoreState(redoStack.pop());log('Refeito.');}
function changed(){scheduleSave();buildProps();buildLayers();redraw();if(mode3d)render3D();}

const toS=p=>P((p.x-view.cx)*view.s+W/2,H/2-(p.y-view.cy)*view.s);

function colorOf(c,L,R){if(!c)return null;if(c==='L')return(!L||L==='auto')?R.fg:L;if(c==='F')return R.fg;if(c==='BG')return R.bg;if(c==='WF')return R.wallFill;return c;}
function getImg(id){if(!id||!doc.images[id])return null;let im=imgCache[id];if(!im){im=new Image();im.onload=()=>{redraw();if(mode3d)render3D();};im.src=doc.images[id];imgCache[id]=im;}return im.complete&&im.naturalWidth?im:null;}
function drawPrim(g,pr,L,R,ov){

    g.translate(pr.p.x,pr.p.y);g.rotate(pr.ang||0);g.scale(1/s,-1/s);

function drawObj(g,o,R,ov){const L=getLayer(o.layer).color;for(const pr of prims(o))drawPrim(g,pr,L,R,ov);}
function drawScene(g,R,list){

function drawGrid(g,R){

  const lines=(step,col)=>{g.beginPath();for(let x=Math.floor(a.x/step)*step;x<=b.x;x+=step){const sx=Math.round(toS(P(x,0)).x)+.5;g.moveTo(sx,0);g.lineTo(sx,H);}for(let y=Math.floor(a.y/step)*step;y<=b.y;y+=step){const sy=Math.round(toS(P(0,y)).y)+.5;g.moveTo(0,sy);g.lineTo(W,sy);}g.strokeStyle=col;g.lineWidth=1;g.stroke();};
  lines(st,R.gridMin);lines(maj,R.gridMaj);
  const o=toS(P(0,0));g.lineWidth=1.5;g.strokeStyle='rgba(255,90,90,.7)';g.beginPath();g.moveTo(o.x,o.y);g.lineTo(o.x+40,o.y);g.stroke();g.strokeStyle='rgba(90,200,120,.8)';g.beginPath();g.moveTo(o.x,o.y);g.lineTo(o.x,o.y-40);g.stroke();

function worldTransform(g){const s=view.s;g.setTransform(DPR*s,0,0,-DPR*s,DPR*(W/2-view.cx*s),DPR*(H/2+view.cy*s));}
function render(){

  for(const id of sel){const o=getObj(id);if(o)drawObj(g,o,R,{stroke:R.sel,lw:2,dash:[6,4]});}

    if(snapRes.k==='end')g.rect(q.x-6,q.y-6,12,12);else if(snapRes.k==='mid'){g.moveTo(q.x,q.y-7);g.lineTo(q.x+7,q.y+5);g.lineTo(q.x-7,q.y+5);g.closePath();}else if(snapRes.k==='cen')g.arc(q.x,q.y,6,0,7);else{g.moveTo(q.x-6,q.y-6);g.lineTo(q.x+6,q.y+6);g.moveTo(q.x+6,q.y-6);g.lineTo(q.x-6,q.y+6);}g.stroke();}

    (W<700?['Comece um projeto:','TE — terreno por dimensões','PA — paredes · PR — retangulares','IM — anexar foto','PO / JA — portas e janelas','AM — ambientes com área']:['Comece um projeto:','TE — terreno por dimensões  ·  PA — paredes  ·  PR — paredes retangulares','IM — anexar foto  ·  PO/JA — portas e janelas  ·  AM — ambientes','Digite o comando abaixo ou use a barra de ferramentas à esquerda.']).forEach((t,i,a)=>g.fillText(t,W/2,H/2-a.length*12+i*24));g.globalAlpha=1;}

/* ---------- alças (grips) ---------- */
function grips(o){
  const r=[],G=(p,set,base)=>r.push({p,set,base});
  switch(o.type){
    case 'line':case 'wall':G(o.a,p=>{o.a=p;},o.b);G(o.b,p=>{o.b=p;},o.a);G(mid(o.a,o.b),p=>{const d=sub(p,mid(o.a,o.b));o.a=add(o.a,d);o.b=add(o.b,d);});break;
    case 'polyline':case 'room':case 'terrain':o.pts.forEach((q,i)=>G(q,p=>{o.pts[i]=p;},o.pts[(i-1+o.pts.length)%o.pts.length]));break;
    case 'circle':G(o.c,p=>{o.c=p;});G(add(o.c,P(o.r,0)),p=>{o.r=Math.max(.001,dist(p,o.c));},o.c);break;
    case 'dim':{G(o.a,p=>{o.a=p;});G(o.b,p=>{o.b=p;});const n=perp(norm(sub(o.b,o.a)));G(add(mid(o.a,o.b),mul(n,o.off)),p=>{o.off=dot(sub(p,o.a),n);});break;}
    case 'text':case 'block':G(o.p,p=>{o.p=p;});break;
    case 'image':{const c=imageCorners(prims(o)[0]);G(o.p,p=>{o.p=p;});G(c[2],p=>{const l=rotV(sub(p,o.p),-(o.rot||0)),nw=Math.max(.05,Math.abs(l.x));o.h=o.h*nw/o.w;o.w=nw;},o.p);break;}
    case 'door':case 'window':{const g=openingGeom(o);if(g)G(g.c,p=>{const w=getObj(o.wallId);const L=wallInfo(w).L;o.off=Math.max(o.w/2,Math.min(L-o.w/2,projT(p,w.a,w.b)*L));});break;}
  }
  return r;
}

/* ---------- transformações ---------- */
function xformObj(o,f,opt={}){
  const k=opt.k||1,ang=opt.ang||0;
  switch(o.type){
    case 'line':case 'wall':o.a=f(o.a);o.b=f(o.b);break;
    case 'dim':o.a=f(o.a);o.b=f(o.b);o.off*=k;if(opt.mirror)o.off=-o.off;break;
    case 'polyline':case 'room':case 'terrain':o.pts=o.pts.map(f);if(o.setbacks&&opt.mirror){}break;
    case 'circle':o.c=f(o.c);o.r*=k;break;
    case 'text':o.p=f(o.p);if(o.size)o.size*=k;o.ang=opt.mirror?readable(2*opt.axis-(o.ang||0)):(o.ang||0)+ang;break;
    case 'block':o.p=f(o.p);if(k!==1){o.w=(o.w||BLOCKS[o.kind].w)*k;o.d=(o.d||BLOCKS[o.kind].d)*k;}if(opt.mirror){o.rot=2*opt.axis-(o.rot||0);o.mirror=!o.mirror;}else o.rot=(o.rot||0)+ang;break;
    case 'image':o.p=f(o.p);o.w*=k;o.h*=k;if(opt.mirror){o.rot=2*opt.axis-(o.rot||0);o.flip=!o.flip;}else o.rot=(o.rot||0)+ang;break;
    case 'door':case 'window':if(opt.mirror)o.flip=!o.flip;if(k!==1)o.off*=k;break;
  }
}
function selectionWithOpenings(ids){const s=new Set(ids);const walls=ids.filter(id=>{const o=getObj(id);return o&&o.type==='wall';});openingsOf(walls).forEach(o=>s.add(o.id));return[...s];}
function applyXform(ids,f,opt,copy){
  const all=selectionWithOpenings(ids),map={},out=[];
  if(copy){
    for(const id of all){const o=getObj(id);if(!o)continue;if((o.type==='door'||o.type==='window')&&!all.includes(o.wallId))continue;const n=clone(o);n.id=uid();map[o.id]=n.id;out.push(n);}
    for(const n of out){if(n.type==='door'||n.type==='window')n.wallId=map[n.wallId];xformObj(n,f,opt);doc.objects.push(n);}
    return out.map(o=>o.id);
  }
  for(const id of all){const o=getObj(id);if(!o)continue;if((o.type==='door'||o.type==='window')&&!opt.mirror&&!(opt.k&&opt.k!==1))continue;if((o.type==='door'||o.type==='window')&&!all.includes(o.wallId))continue;xformObj(o,f,opt);}
  return ids;
}
function previewXform(ids,f,opt){const all=selectionWithOpenings(ids).map(getObj).filter(o=>o&&o.type!=='door'&&o.type!=='window');return all.map(o=>{const n=clone(o);xformObj(n,f,opt);return n;});}
function eraseSel(){if(!sel.size)return log('Nada selecionado.');const all=new Set(selectionWithOpenings([...sel]));const n=all.size;doc.objects=doc.objects.filter(o=>!all.has(o.id));sel.clear();commit();log(n+' objeto(s) apagado(s).');}

/* ---------- ferramentas ---------- */
const Tools={};
function setPrompt(t){$('#promptTxt').textContent=t||'Comando:';}
function startTool(name,...args){
  if(tool)endTool(true);measureOverlay=null;
  const f=Tools[name];if(!f)return log('Comando desconhecido: '+name,'err');
  const t=f(...args);lastCmd=name;
  if(!t){updateToolUI();return;}
  tool=t;tool.name=name;panMode=false;
  setPrompt(t.prompt);updateToolUI();redraw();
}
function endTool(silent){if(tool&&tool.cancel)tool.cancel();tool=null;setPrompt();updateToolUI();redraw();}
function makeChainTool(title,type,makeObj){
  const t={base:null,start:null,prompt:title+' — primeiro ponto (clique ou digite x;y)',
    point(p){if(!t.base){t.base=p;t.start=p;setPrompt(title+' — próximo ponto (comprimento, @dx;dy, @d<ângulo) · Enter termina · F fecha');return;}if(dist(p,t.base)<1e-9)return;addObj(makeObj(t.base,p));commit();t.base=p;},
    value(v){if(/^[fc]$/i.test(v)&&t.start&&t.base&&dist(t.start,t.base)>1e-9){addObj(makeObj(t.base,t.start));commit();endTool();return true;}return false;},
    enter(){endTool();},
    preview(){return t.base?{objs:[{...makeObj(t.base,cur()),layer:layerFor(type)}]}:null;}};
  return t;
}
function makePolyTool(title,minPts,onDone,previewType,allowOpen){
  const t={pts:[],get base(){return t.pts[t.pts.length-1]||null;},prompt:title+' — primeiro ponto',
    point(p){if(t.pts.length>=minPts&&dist(p,t.pts[0])<10/view.s){t.finish(true);return;}t.pts.push(p);setPrompt(title+' — próximo ponto · Enter/F fecha · D desfaz último');},
    value(v){if(/^[fc]$/i.test(v)){t.finish(true);return true;}if(/^d$/i.test(v)){t.pts.pop();return true;}return false;},
    enter(){t.finish(!allowOpen);},
    finish(closed){if(t.pts.length<(closed?minPts:2)){log('Pontos insuficientes.','err');endTool();return;}const pts=t.pts;endTool();onDone(pts,closed);},
    preview(){if(!t.pts.length)return null;const pts=[...t.pts,cur()];return previewType?{objs:[{type:previewType,pts,closed:!allowOpen,name:''}]}:{prims:[{k:'poly',pts,closed:!allowOpen}]};}};
  return t;
}
function makeRectTool(title,onDone,previewFn){
  const t={base:null,prompt:title+' — primeiro canto',
    point(p){if(!t.base){t.base=p;setPrompt(title+' — canto oposto (ou digite LarguraxAltura, ex.: 10x20)');return;}if(Math.abs(p.x-t.base.x)<1e-9||Math.abs(p.y-t.base.y)<1e-9)return;const a=t.base;endTool();onDone(a,p);},
    value(v){const m=v.match(/^(-?[\d.,]+)\s*[xX×*]\s*(-?[\d.,]+)$/);if(m&&t.base){const c=cur(),sx=Math.sign(c.x-t.base.x)||1,sy=Math.sign(c.y-t.base.y)||1;t.point(P(t.base.x+sx*num(m[1]),t.base.y+sy*num(m[2])));return true;}return false;},
    preview(){return t.base?previewFn(t.base,cur()):null;}};
  return t;
}

  PA:'wall',PAREDE:'wall',PR:'wallrect',PO:'door',PORTA:'door',JA:'window',JANELA:'window',AM:'room',AMBIENTE:'room',B:'block',BLOCO:'block',MOB:'block',
  CO:'dim',COTA:'dim',T:'text',TEXTO:'text',TE:'terrainDlg',TERRENO:'terrainDlg',TL:'terrain',IM:'image',IMAGEM:'image',FOTO:'image',
  M:'move',MOVER:'move',CP:'copy',COPIAR:'copy',RO:'rotate',ROTACIONAR:'rotate',ES:'mirror',ESPELHAR:'mirror',ESC:'scale',ESCALA:'scale',
  APAGAR:'erase',DEL:'erase',E:'erase',DI:'measure',DIST:'measure',AR:'area',AREA:'area',SEL:'select',PAN:'pan'};

}

const cam={yaw:-2.2,pitch:.6,dist:40,t:{x:10,y:8,z:1}};

function build3D(){
  const F=[],vis=o=>getLayer(o.layer).visible!==false;
  const quad=(pts,col,ds,alpha)=>F.push({pts,col,ds:!!ds,alpha:alpha??1});

  for(const o of doc.objects){if(!vis(o))continue;
    if(o.type==='terrain')quad(o.pts.map(p=>({x:p.x,y:p.y,z:-.02})),[96,150,84],true);
    if(o.type==='room')quad(o.pts.map(p=>({x:p.x,y:p.y,z:.01})),[206,184,150],true);
    if(o.type==='image'){/* fotos não são exibidas em 3D */}
    if(o.type==='block'){const B=BLOCKS[o.kind];if(!B)continue;const w=o.w||B.w,d=o.d||B.d,T=q=>add(o.p,rotV(q,o.rot||0));const fp=rectL(-w/2,-d/2,w/2,d/2).map(T);if(o.kind==='arvore'){box(rectL(-.12,-.12,.12,.12).map(T),0,2.2,[120,90,60]);box(ellL(0,0,w/2,d/2,10).map(T),2.2,B.h,[70,140,70]);}else box(fp,0,B.h,o.kind==='carro'?[170,60,60]:[150,170,200]);}
  }
  for(const w of doc.objects){if(w.type!=='wall'||!vis(w))continue;
    const{L,u,n}=wallInfo(w),[ea,eb]=wallExt(w),H=w.h||S().wallH,t=w.t/2,col=[228,224,216];
    const seg=(s0,s1,z0,z1)=>{if(s1-s0<1e-4||z1-z0<1e-4)return;box([add(add(w.a,mul(u,s0)),mul(n,t)),add(add(w.a,mul(u,s1)),mul(n,t)),sub(add(w.a,mul(u,s1)),mul(n,t)),sub(add(w.a,mul(u,s0)),mul(n,t))],z0,z1,col);};
    const ops=openingsOf([w.id]).filter(vis).map(o=>{const off=Math.max(o.w/2,Math.min(L-o.w/2,o.off));return{o,s0:off-o.w/2,s1:off+o.w/2};}).sort((a,b)=>a.s0-b.s0);
    let c=-ea;
    for(const op of ops){if(op.s0>c)seg(c,op.s0,0,H);const s0=Math.max(c,op.s0);
      if(op.o.type==='door'){seg(s0,op.s1,Math.min(op.o.h||2.1,H),H);}
      else{const si=op.o.sill??1,hh=op.o.h??1.2;seg(s0,op.s1,0,si);seg(s0,op.s1,Math.min(si+hh,H),H);const p0=add(w.a,mul(u,s0)),p1=add(w.a,mul(u,op.s1));quad([{x:p0.x,y:p0.y,z:si},{x:p1.x,y:p1.y,z:si},{x:p1.x,y:p1.y,z:Math.min(si+hh,H)},{x:p0.x,y:p0.y,z:Math.min(si+hh,H)}],[120,175,225],true,.45);}
      c=Math.max(c,op.s1);}
    if(c<L+eb)seg(c,L+eb,0,H);
  }

function render3D(){
  const g=g3;g.setTransform(DPR,0,0,DPR,0,0);
  const grd=g.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#9cc4e8');grd.addColorStop(1,'#e8eef4');g.fillStyle=grd;g.fillRect(0,0,W,H);
  const cp_=Math.cos(cam.pitch),pos={x:cam.t.x+cam.dist*cp_*Math.cos(cam.yaw),y:cam.t.y+cam.dist*cp_*Math.sin(cam.yaw),z:cam.t.z+cam.dist*Math.sin(cam.pitch)};
  const v3=(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}),d3=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,c3=(a,b)=>({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x}),n3=a=>{const l=Math.hypot(a.x,a.y,a.z)||1;return{x:a.x/l,y:a.y/l,z:a.z/l};};
  const f=n3(v3(cam.t,pos));let r=n3(c3(f,{x:0,y:0,z:1}));if(!isFinite(r.x)||Math.hypot(r.x,r.y,r.z)<.5)r={x:1,y:0,z:0};const up=c3(r,f),FL=Math.min(W,H)*1.1;

  for(const fc of build3D()){
    const nrm=n3(c3(v3(fc.pts[1],fc.pts[0]),v3(fc.pts[2],fc.pts[0])));
    const toCam=v3(pos,fc.pts[0]);let nn=nrm;if(d3(nrm,toCam)<=0){if(!fc.ds)continue;nn={x:-nrm.x,y:-nrm.y,z:-nrm.z};}
    let ok=true,depth=0;const sp=fc.pts.map(p=>{const v=v3(p,pos),z=d3(v,f);if(z<.1)ok=false;depth+=z;return[W/2+d3(v,r)/z*FL,H/2-d3(v,up)/z*FL];});
    if(!ok)continue;const sh=.55+.45*Math.max(0,d3(nn,light));faces.push({sp,depth:depth/fc.pts.length,col:fc.col.map(c=>Math.round(c*sh)),alpha:fc.alpha,ds:fc.ds});
  }
  faces.sort((a,b)=>b.depth-a.depth);
  for(const fc of faces){g.beginPath();fc.sp.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.globalAlpha=fc.alpha;g.fillStyle='rgb('+fc.col.join(',')+')';g.fill();g.globalAlpha=Math.min(1,fc.alpha+.2);g.strokeStyle='rgba(40,40,40,.35)';g.lineWidth=.6;g.stroke();g.globalAlpha=1;}
  if(!faces.length){g.fillStyle='#234';g.font='15px system-ui';g.textAlign='center';g.fillText('Desenhe paredes (PA), ambientes ou terreno para ver o modelo 3D.',W/2,H/2);}
}

cv3.addEventListener('pointermove',e=>{if(!d3drag)return;const dx=e.clientX-d3drag.x,dy=e.clientY-d3drag.y;d3drag.x=e.clientX;d3drag.y=e.clientY;
  if(d3drag.pan){const k=cam.dist/700,sy=Math.sin(cam.yaw),cy=Math.cos(cam.yaw);cam.t.x+=(dx*sy-dy*cy)*k*-1;cam.t.y+=(-dx*cy-dy*sy)*k*-1;}
  else{cam.yaw-=dx*.008;cam.pitch=Math.max(.03,Math.min(1.55,cam.pitch+dy*.008));}render3D();});
cv3.addEventListener('pointerup',()=>{d3drag=null;});
cv3.addEventListener('wheel',e=>{e.preventDefault();cam.dist=Math.max(1,Math.min(2000,cam.dist*Math.pow(1.0015,e.deltaY)));render3D();},{passive:false});
$$('[data-v3]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.v3;if(v==='fit')fit3D();if(v==='iso'){cam.yaw=-2.2;cam.pitch=.6;}if(v==='top'){cam.pitch=1.55;cam.yaw=-Math.PI/2;}if(v==='front'){cam.yaw=-Math.PI/2;cam.pitch=.08;}render3D();}));
function setView(v){mode3d=v==='3d';$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.view===v));cv.hidden=mode3d;cv3.hidden=!mode3d;$('#view3dBar').hidden=!mode3d;$('#tip').style.display='none';if(mode3d){if(tool)endTool();fit3D();render3D();}else redraw();}
$$('.tab').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));

/* ---------- exportação ---------- */
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name.replace(/[\\/:*?"<>|]+/g,'_');document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
function renderToCanvas(maxPx){
  const b=docBBox();if(!b)return null;const pad=Math.max(b.x1-b.x0,b.y1-b.y0)*.05+.5;const x0=b.x0-pad,y0=b.y0-pad,w=b.x1-b.x0+2*pad,h=b.y1-b.y0+2*pad;
  const s=Math.min(maxPx/w,maxPx/h,200);const c=document.createElement('canvas');c.width=Math.ceil(w*s);c.height=Math.ceil(h*s);const g=c.getContext('2d');
  const R={bg:'#ffffff',fg:'#111111',wallFill:'#4a5059',s,export:true,lwk:Math.max(1,c.width/1600)};
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.setTransform(s,0,0,-s,-x0*s,(y0+h)*s);drawScene(g,R,doc.objects);return{c,s};
}
async function exportPNG(){const r=renderToCanvas(3200);if(!r)return log('Nada para exportar.','err');r.c.toBlob(b=>download(doc.name+'.png',b));log('PNG exportado ('+r.c.width+'×'+r.c.height+' px).','res');}
function exportSVG(){
  const b=docBBox();if(!b)return log('Nada para exportar.','err');const pad=Math.max(b.x1-b.x0,b.y1-b.y0)*.05+.5;const x0=b.x0-pad,y0=b.y0-pad,w=b.x1-b.x0+2*pad,h=b.y1-b.y0+2*pad,pxw=1600,k=pxw/w;
  const R={bg:'#ffffff',fg:'#111111',wallFill:'#4a5059'};const nf=v=>+v.toFixed(4);
  const out=['<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="'+pxw+'" height="'+Math.round(h*k)+'" viewBox="'+nf(x0)+' '+nf(-(y0+h))+' '+nf(w)+' '+nf(h)+'"><rect x="'+nf(x0)+'" y="'+nf(-(y0+h))+'" width="'+nf(w)+'" height="'+nf(h)+'" fill="#fff"/><g transform="scale(1,-1)" stroke-linecap="round" stroke-linejoin="round">'];
  const st=(pr,L)=>{const s=colorOf(pr.stroke,L,R),f=colorOf(pr.fill,L,R);return' fill="'+(f||'none')+'"'+(f&&pr.fillAlpha!=null?' fill-opacity="'+pr.fillAlpha+'"':'')+(s?' stroke="'+s+'" stroke-width="'+nf((pr.lw||1)/k*1.2)+'"'+(pr.dash?' stroke-dasharray="'+pr.dash.map(v=>nf(v/k*1.5)).join(' ')+'"':''):'');};
  const prim=(pr,L)=>{
    if(pr.k==='poly')return'<'+(pr.closed?'polygon':'polyline')+' points="'+pr.pts.map(p=>nf(p.x)+','+nf(p.y)).join(' ')+'"'+st(pr,L)+'/>';
    if(pr.k==='circle')return'<circle cx="'+nf(pr.c.x)+'" cy="'+nf(pr.c.y)+'" r="'+nf(pr.r)+'"'+st(pr,L)+'/>';
    if(pr.k==='arc'){const p0=add(pr.c,P(Math.cos(pr.a0)*pr.r,Math.sin(pr.a0)*pr.r)),p1=add(pr.c,P(Math.cos(pr.a1)*pr.r,Math.sin(pr.a1)*pr.r));return'<path d="M'+nf(p0.x)+' '+nf(p0.y)+' A'+nf(pr.r)+' '+nf(pr.r)+' 0 0 '+(pr.ccw?1:0)+' '+nf(p1.x)+' '+nf(p1.y)+'"'+st({...pr,fill:null},L)+'/>';}
    if(pr.k==='text'){const lines=String(pr.text).split('\n'),n=lines.length,lh=pr.size*1.2;return'<g transform="translate('+nf(pr.p.x)+' '+nf(pr.p.y)+') rotate('+nf((pr.ang||0)*R2D)+') scale(1,-1)"><text font-family="Arial,sans-serif" font-size="'+nf(pr.size)+'"'+(pr.bold?' font-weight="600"':'')+' fill="'+colorOf(pr.color,L,R)+'" text-anchor="'+(pr.align==='center'?'middle':'start')+'" dominant-baseline="middle">'+lines.map((t,i)=>'<tspan x="0" y="'+nf(pr.base==='middle'?(i-(n-1)/2)*lh:-(n-1-i)*lh-pr.size*.45)+'">'+esc(t)+'</tspan>').join('')+'</text></g>';}
    if(pr.k==='image'){const src=doc.images[pr.img];if(!src)return'';return'<g transform="translate('+nf(pr.p.x)+' '+nf(pr.p.y)+') rotate('+nf((pr.rot||0)*R2D)+')'+(pr.flip?' scale(-1,1)':'')+' scale(1,-1)"><image href="'+src+'" x="0" y="'+nf(-pr.h)+'" width="'+nf(pr.w)+'" height="'+nf(pr.h)+'" opacity="'+pr.opacity+'" preserveAspectRatio="none"/></g>';}
    return'';};
  const objs=doc.objects.filter(o=>getLayer(o.layer).visible!==false).sort((a,b)=>ORDER[a.type]-ORDER[b.type]);
  for(const o of objs){if(o.type==='wall')continue;if(ORDER[o.type]<5){const L=getLayer(o.layer).color;prims(o).forEach(pr=>out.push(prim(pr,L)));}}
  const walls=objs.filter(o=>o.type==='wall');
  walls.forEach(w=>out.push('<polygon points="'+wallPoly(w).map(p=>nf(p.x)+','+nf(p.y)).join(' ')+'" fill="none" stroke="'+colorOf('L',getLayer(w.layer).color,R)+'" stroke-width="'+nf(3/k)+'"/>'));
  walls.forEach(w=>out.push('<polygon points="'+wallPoly(w).map(p=>nf(p.x)+','+nf(p.y)).join(' ')+'" fill="'+R.wallFill+'"/>'));
  for(const o of objs){if(ORDER[o.type]>5){const L=getLayer(o.layer).color;prims(o).forEach(pr=>out.push(prim(pr,L)));}}
  out.push('</g></svg>');download(doc.name+'.svg',new Blob([out.join('\n')],{type:'image/svg+xml'}));log('SVG exportado.','res');
}
function exportDXF(){
  if(!doc.objects.length)return log('Nada para exportar.','err');
  const ACI=[[1,255,0,0],[2,255,255,0],[3,0,255,0],[4,0,255,255],[5,0,0,255],[6,255,0,255],[7,255,255,255],[8,128,128,128],[9,192,192,192],[30,255,127,0],[40,255,191,0],[150,0,127,255],[200,191,127,255]];
  const aci=hex=>{if(!hex||hex==='auto')return 7;const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);let best=7,bd=Infinity;ACI.forEach(([i,R,G,B])=>{const d=(r-R)**2+(g-G)**2+(b-B)**2;if(d<bd){bd=d;best=i;}});return best;};
  const lname=id=>getLayer(id).name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9_-]/g,'_').toUpperCase()||'0';
  const o=[],w=(c,v)=>{o.push(String(c));o.push(typeof v==='number'?(+v.toFixed(6)).toString():String(v));};
  w(0,'SECTION');w(2,'HEADER');w(9,'$ACADVER');w(1,'AC1009');w(9,'$INSUNITS');w(70,6);w(0,'ENDSEC');
  w(0,'SECTION');w(2,'TABLES');w(0,'TABLE');w(2,'LAYER');w(70,doc.layers.length);
  doc.layers.forEach(l=>{w(0,'LAYER');w(2,lname(l.id));w(70,0);w(62,aci(l.color));w(6,'CONTINUOUS');});
  w(0,'ENDTAB');w(0,'ENDSEC');w(0,'SECTION');w(2,'ENTITIES');
  const line=(L,a,b)=>{w(0,'LINE');w(8,L);w(10,a.x);w(20,a.y);w(30,0);w(11,b.x);w(21,b.y);w(31,0);};
  const ascii=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/²/g,'2').replace(/[^\x20-\x7e]/g,'?');
  for(const ob of doc.objects){if(getLayer(ob.layer).visible===false||ob.type==='image')continue;const L=lname(ob.layer);
    for(const pr of prims(ob)){
      if(pr.k==='poly'){const n=pr.pts.length;for(let i=0;i<n-(pr.closed?0:1);i++)line(L,pr.pts[i],pr.pts[(i+1)%n]);}
      else if(pr.k==='circle'){w(0,'CIRCLE');w(8,L);w(10,pr.c.x);w(20,pr.c.y);w(30,0);w(40,pr.r);}
      else if(pr.k==='arc'){const a0=(pr.ccw?pr.a0:pr.a1)*R2D,a1=(pr.ccw?pr.a1:pr.a0)*R2D;w(0,'ARC');w(8,L);w(10,pr.c.x);w(20,pr.c.y);w(30,0);w(40,pr.r);w(50,(a0+360)%360);w(51,(a1+360)%360);}
      else if(pr.k==='text'){const lines=String(pr.text).split('\n'),n=lines.length,lh=pr.size*1.2;lines.forEach((t,i)=>{const dy=pr.base==='middle'?-(i-(n-1)/2)*lh:(n-1-i)*lh;const p=add(pr.p,rotV(P(0,dy),pr.ang||0));w(0,'TEXT');w(8,L);w(10,p.x);w(20,p.y);w(30,0);w(40,pr.size);w(1,ascii(t));w(50,(pr.ang||0)*R2D);if(pr.align==='center'||pr.base==='middle'){w(72,pr.align==='center'?1:0);w(11,p.x);w(21,p.y);w(31,0);w(73,pr.base==='middle'?2:1);}});}
    }}
  w(0,'ENDSEC');w(0,'EOF');
  download(doc.name+'.dxf',new Blob([o.join('\r\n')+'\r\n'],{type:'application/dxf'}));log('DXF exportado (abre no AutoCAD, LibreCAD, DraftSight etc.).','res');
}
function exportJSON(){prune();download(doc.name+'.vorticis.json',new Blob([JSON.stringify(doc)],{type:'application/json'}));log('Backup JSON exportado.','res');}
function printPlan(){const r=renderToCanvas(2400);if(!r)return log('Nada para imprimir.','err');const pa=$('#printArea');pa.innerHTML='<h2 style="font:600 16pt Arial;margin:0 0 4mm">'+esc(doc.name)+'</h2><img alt="Planta"><p style="font:9pt Arial">Vorticis Architecture · '+new Date().toLocaleDateString('pt-BR')+' · unidades em metros</p>';const img=pa.querySelector('img');img.onload=()=>setTimeout(()=>window.print(),50);img.src=r.c.toDataURL('image/png');}
$('#fileJson').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.objects))throw new Error('arquivo não é um projeto do Vorticis Architecture');await saveNow();loadDoc(d,true);let nm=d.name||'Importado';const names=(await store.all()).map(r=>r.name);while(names.includes(nm))nm+=' (importado)';doc.name=nm;$('#projName').value=nm;await saveNow(true);log('Projeto importado: '+nm,'res');}catch(err){log('Falha ao importar: '+err.message,'err');}});

/* ---------- armazenamento (IndexedDB com fallback) ---------- */
const store={db:null,
  async init(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('vorticis-architecture',1);r.onupgradeneeded=()=>r.result.createObjectStore('projects',{keyPath:'name'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}catch(e){this.db=null;}},
  os(m){return this.db.transaction('projects',m).objectStore('projects');},
  rq(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  async put(rec){if(this.db)return this.rq(this.os('readwrite').put(rec));localStorage.setItem('va:p:'+rec.name,JSON.stringify(rec));},
  async get(name){if(this.db)return this.rq(this.os('readonly').get(name));try{return JSON.parse(localStorage.getItem('va:p:'+name));}catch(e){return null;}},
  async all(){if(this.db){const a=await this.rq(this.os('readonly').getAll());return a.map(r=>({name:r.name,updated:r.updated,n:(r.doc.objects||[]).length}));}const a=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('va:p:'))try{const r=JSON.parse(localStorage.getItem(k));a.push({name:r.name,updated:r.updated,n:r.doc.objects.length});}catch(e){}}return a;},
  async del(name){if(this.db)return this.rq(this.os('readwrite').delete(name));localStorage.removeItem('va:p:'+name);}};
function prune(){const used=new Set(doc.objects.filter(o=>o.type==='image').map(o=>o.img));const keep=new Set([...used]);undoStack.concat(redoStack).forEach(s=>{const m=s.match(/"img":"(img[^"]+)"/g);if(m)m.forEach(x=>keep.add(x.slice(7,-1)));});for(const k of Object.keys(doc.images))if(!keep.has(k))delete doc.images[k];}
let saveTimer=null;
function scheduleSave(){clearTimeout(saveTimer);$('#saveInfo').textContent='Alterações não salvas…';saveTimer=setTimeout(()=>saveNow(),800);}
async function saveNow(explicit){clearTimeout(saveTimer);try{prune();doc.view={...view};await store.put({name:doc.name,updated:Date.now(),doc:JSON.parse(JSON.stringify(doc))});try{localStorage.setItem('va:last',doc.name);}catch(e){}$('#saveInfo').textContent='Salvo às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+(store.db?'':' (armazenamento limitado)');if(explicit)log('Projeto "'+doc.name+'" salvo neste navegador.','res');}catch(e){$('#saveInfo').textContent='Falha ao salvar!';log('Falha ao salvar: '+e.message+' — exporte um backup JSON.','err');}}
function loadDoc(d,fit){
  const base=newDoc(d.name);doc={...base,...d,settings:{...DEFAULT_SETTINGS,...(d.settings||{})},images:d.images||{},layers:(d.layers&&d.layers.length?d.layers:base.layers)};
  if(!doc.layers.some(l=>l.id===doc.activeLayer))doc.activeLayer=doc.layers[0].id;
  doc.objects.forEach(o=>{if(!o.id)o.id=uid();if(!doc.layers.some(l=>l.id===o.layer))o.layer=doc.layers[0].id;});
  for(const k in imgCache)delete imgCache[k];
  sel.clear();hoverId=null;if(tool)endTool();resetHistory();$('#projName').value=doc.name;
  if(d.view&&!fit)view={...d.view};else zoomExtents();
  buildProps();buildLayers();updateToolUI();redraw();if(mode3d){fit3D();render3D();}
}
async function projectsDialog(){
  const list=(await store.all()).sort((a,b)=>b.updated-a.updated);
  const html='<table class="t" style="min-width:min(520px,80vw)"><thead><tr><th>Projeto</th><th>Atualizado</th><th class="n">Objetos</th><th></th></tr></thead><tbody>'+
    (list.length?list.map(r=>'<tr><td>'+(r.name===doc.name?'<b>'+esc(r.name)+'</b> <span class="muted">(aberto)</span>':esc(r.name))+'</td><td>'+new Date(r.updated).toLocaleString('pt-BR')+'</td><td class="n">'+r.n+'</td><td style="white-space:nowrap"><button type="button" data-open="'+esc(r.name)+'">Abrir</button> <button type="button" class="danger" data-del="'+esc(r.name)+'">Excluir</button></td></tr>').join(''):'<tr><td colspan="4" class="muted">Nenhum projeto salvo.</td></tr>')+'</tbody></table>'+
    '<p class="muted">Projetos ficam salvos neste navegador/dispositivo. Para levar a outro computador, use Exportar → Backup JSON e depois Importar.</p>';
  modal('Projetos',html,[{label:'Salvar como…',onClick:async()=>{const n=await askText('Salvar como (novo nome)',doc.name+' - cópia');if(n){doc.name=n.trim();$('#projName').value=doc.name;await saveNow(true);}return true;}},{label:'Fechar',primary:true}],body=>{
    body.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',async()=>{await saveNow();const r=await store.get(b.dataset.open);if(r){loadDoc(r.doc);log('Projeto aberto: '+r.name);try{localStorage.setItem('va:last',r.name);}catch(e){}}dlg.close();}));
    body.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async()=>{const n=b.dataset.del;if(!confirm('Excluir o projeto "'+n+'"? Esta ação não pode ser desfeita.'))return;await store.del(n);if(n===doc.name){loadDoc(newDoc(await uniqueName()));}b.closest('tr').remove();}));
  });
}
async function uniqueName(){const names=new Set((await store.all()).map(r=>r.name));let i=1;while(names.has('Projeto '+i))i++;return'Projeto '+i;}
async function newProject(){await saveNow();loadDoc(newDoc(await uniqueName()));await saveNow();log('Novo projeto criado: '+doc.name);}
$('#projName').addEventListener('change',async e=>{const nn=e.target.value.trim();if(!nn||nn===doc.name){e.target.value=doc.name;return;}const ex=await store.get(nn);if(ex&&!confirm('Já existe um projeto "'+nn+'". Substituir?')){e.target.value=doc.name;return;}const old=doc.name;doc.name=nn;await saveNow();await store.del(old);log('Projeto renomeado para "'+nn+'".');});

/* ---------- menus ---------- */
function openPanel(){$('#panel').classList.add('open');}
$('#panelToggle').addEventListener('click',()=>$('#panel').classList.toggle('open'));
const ACT={new:newProject,projects:projectsDialog,save:()=>saveNow(true),png:exportPNG,svg:exportSVG,dxf:exportDXF,json:exportJSON,print:printPlan,import:()=>$('#fileJson').click(),areas:areasDialog,settings:settingsDialog,help:helpDialog,
  zoomin:()=>mode3d?(cam.dist/=1.25,render3D()):zoomAt(P(W/2,H/2),1.25),zoomout:()=>mode3d?(cam.dist*=1.25,render3D()):zoomAt(P(W/2,H/2),1/1.25),extents:zoomExtents};
$$('[data-act]').forEach(b=>b.addEventListener('click',()=>{const d=b.closest('details');if(d)d.open=false;ACT[b.dataset.act]();}));
$$('.dd').forEach(d=>d.addEventListener('toggle',()=>{if(d.open){const r=d.querySelector('summary').getBoundingClientRect(),m=d.querySelector('div');m.style.left=Math.min(r.left,innerWidth-220)+'px';m.style.top=r.bottom+'px';}}));
document.addEventListener('click',e=>{$$('.dd[open]').forEach(d=>{if(!d.contains(e.target))d.open=false;});});

/* ---------- inicialização ---------- */
window.addEventListener('resize',resize);
window.addEventListener('beforeunload',()=>{if(saveTimer){saveNow();}});
(async function init(){
  buildToolbar();updateToggles();
  await store.init();
  resize();
  let loaded=false;
  try{const last=localStorage.getItem('va:last');if(last){const r=await store.get(last);if(r&&r.doc){loadDoc(r.doc);loaded=true;}}}catch(e){}
  if(!loaded){loadDoc(newDoc(await uniqueName()));}
  resetHistory();
  log('Vorticis Architecture pronto. Digite AJUDA para ver os comandos.');
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
