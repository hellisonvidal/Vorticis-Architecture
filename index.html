<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vorticis Architecture</title>
<meta name="description" content="CAD arquitetônico no navegador: plantas, paredes, portas, janelas, telhados, terreno, 3D e troca de arquivos DWG, DXF, PDF, IFC.">
<meta name="theme-color" content="#0f1512">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script>
  // aplica o tema antes de desenhar a página (evita "piscar")
  (function(){try{var t=localStorage.getItem('va:theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="titlebar">
    <div class="brand"><img src="icon.svg" alt="" width="26" height="26"><span><b>Vorticis</b> Architecture</span></div>
    <div class="qa">
      <button class="ib" data-act="undo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="ib" data-act="redo" title="Refazer (Ctrl+Y)" aria-label="Refazer"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <button class="ib" data-act="save" title="Salvar (Ctrl+S)" aria-label="Salvar"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg></button>
    </div>
    <input id="projName" title="Nome do projeto (renomeia ao alterar)" aria-label="Nome do projeto">
    <div class="spacer"></div>
    <div class="seg" role="tablist" aria-label="Vista">
      <button class="on" data-view="2d">Planta 2D</button><button data-view="3d">Vista 3D</button>
    </div>
    <button class="ib" id="themeBtn" title="Tema claro / escuro" aria-label="Alternar tema"><svg viewBox="0 0 24 24" class="sun"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg viewBox="0 0 24 24" class="moon"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    <button class="ib" id="panelToggle" title="Propriedades e camadas" aria-label="Painel lateral"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
  </header>
  <nav id="ribbonTabs" role="tablist" aria-label="Faixa de opções"></nav>
  <div id="ribbon"></div>
  <div id="optbar"></div>
  <main id="main">
    <section id="stage">
      <div id="canvasWrap">
        <canvas id="cv"></canvas>
        <div id="view3d" hidden></div>
        <canvas id="cv3" hidden></canvas>
        <div id="tip"></div>
        <div id="view3dBar" class="float" hidden>
          <button data-v3="iso">Isométrica</button><button data-v3="top">Superior</button><button data-v3="front">Frontal</button><button data-v3="fit">Enquadrar</button>
          <label><input type="checkbox" id="v3roof" checked> Telhado</label>
          <label><input type="checkbox" id="v3shadow" checked> Sombras</label>
          <label><input type="checkbox" id="v3edges" checked> Contornos</label>
          <button data-v3="png">Salvar imagem</button>
          <span id="v3info" class="muted"></span>
        </div>
        <div class="zoomBtns float">
          <button data-act="zoomin" title="Aproximar" aria-label="Aproximar">+</button>
          <button data-act="zoomout" title="Afastar" aria-label="Afastar">−</button>
          <button data-act="extents" title="Enquadrar tudo (Z)" aria-label="Enquadrar tudo">⤢</button>
        </div>
        <div id="dropHint" hidden><div>Solte o arquivo para importar<br><small>DWG · DXF · PDF · SVG · DWFx · imagens · projeto JSON</small></div></div>
      </div>
    </section>
    <aside id="panel">
      <div class="ptabs" role="tablist"><button class="on" data-ptab="props">Propriedades</button><button data-ptab="layers">Camadas</button><button class="pclose" data-act="panel" title="Fechar painel" aria-label="Fechar painel">✕</button></div>
      <section id="pt-props"><div id="props"></div></section>
      <section id="pt-layers" hidden><div class="phead"><span class="muted">Ativa · cor · nome · ver · travar</span><button id="addLayer" class="sm">+ Nova</button></div><div id="layers"></div></section>
    </aside>
  </main>
  <footer id="foot">
    <div id="cmdArea">
      <div id="log" aria-live="polite"></div>
      <div class="cmdrow"><span id="promptTxt">Comando:</span><input id="cmd" autocomplete="off" spellcheck="false" placeholder="Digite um comando (PA, PO, TEL, L…) ou valores (5 · 3;4 · @2;0 · @5&lt;45 · 10x20)" aria-label="Linha de comando"></div>
    </div>
    <div id="status">
      <span id="coords">X 0,00  Y 0,00</span>
      <button class="tg" data-tg="snap" title="Passo do cursor (F9)">PASSO</button>
      <button class="tg" data-tg="grid" title="Grade (F7)">GRADE</button>
      <button class="tg" data-tg="osnap" title="Snap a objetos (F3)">OSNAP</button>
      <button class="tg" data-tg="ortho" title="Modo ortogonal (F8)">ORTO</button>
      <button class="tg" data-tg="polar" title="Rastreamento polar a cada 15° (F10)">POLAR</button>
      <span id="zoomInfo" class="muted"></span>
      <span id="saveInfo"></span>
    </div>
  </footer>
</div>
<dialog id="dlg"><form method="dialog" onsubmit="return false"><h2 id="dlgTitle"></h2><div id="dlgBody"></div><div id="dlgBtns"></div></form></dialog>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileAny" accept=".dwg,.bak,.dxf,.pdf,.svg,.dwfx,.dwf,.json,.png,.jpg,.jpeg,.webp,.gif,.bmp,image/*,application/pdf" hidden>
<div id="printArea"></div>
<script src="js/core.js"></script>
<script src="js/tools.js"></script>
<script src="js/elements.js"></script>
<script src="js/smart.js"></script>
<script src="js/ui.js"></script>
<script src="js/photo.js"></script>
<script src="js/io.js"></script>
<script src="js/import.js"></script>
<script src="js/export.js"></script>
<script src="js/view3d-fallback.js"></script>
<script src="js/view3d.js"></script>
<script src="js/app.js"></script>
</body>
</html>
